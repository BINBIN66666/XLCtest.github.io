<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourBrand | 重新定义舒适内衣</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* 这里是你的“皮肤”基础设置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: #333; line-height: 1.6; }
        
        /* 全屏海报区样式 */
        .hero { 
            height: 80vh; 
            background: #f5f0ed url('your-image.jpg') center/cover no-repeat; 
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .hero-content h1 { font-size: 3rem; font-weight: 300; letter-spacing: 2px; }
        .cta-button { 
            display: inline-block; padding: 15px 40px; background: #333; color: white; 
            text-decoration: none; margin-top: 20px; border-radius: 2px;
        }

        /* 浮动 WhatsApp 按钮 */
        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px;
            background: #25D366; color: white; width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000;
        }
    </style>
</head>
<body>

    <nav style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
        <div style="font-weight: 600; font-size: 1.5rem;">YOURBRAND</div>
        <div>
            <a href="#products" style="margin-left: 20px; text-decoration: none; color: #333;">系列</a>
            <a href="#" style="margin-left: 20px; text-decoration: none; color: #333;">关于</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>让身体呼吸的内衣</h1>
            <p>采用 2026 最新科技面料，专为亚洲身材设计</p>
            <a href="#products" class="cta-button">立即选购</a>
        </div>
    </section>

    <a href="https://wa.me/你的号码" class="whatsapp-float" target="_blank">
        Chat
    </a>

</body>
</html>
